server:
  port: 8082

spring:
  application:
    name: hn-product-service
  datasource:
    url: jdbc:postgresql://localhost:5433/hn_product_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

jwt:
  signer-key: ${SECRET_KEY}
  issuer: hn-ecommerce

app:
  upload-dir: uploads
  public-url-prefix: /api/v1/product
