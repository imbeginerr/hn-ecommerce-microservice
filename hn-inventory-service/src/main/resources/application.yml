server:
  port: 8083
spring:
  application:
    name: hn-inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5435/hn_inventory_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

jwt:
  signer-key: ${SECRET_KEY}
  issuer: hn-ecommerce
